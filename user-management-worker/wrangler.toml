name = "user-management-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Databases
[[d1_databases]]
binding = "USER_DB"
database_name = "user-db"
database_id = "863a849b-1dd9-4832-a23b-977ff508713a"

# Optional Workers AI binding used for ephemeral pantry photo scanning.
[ai]
binding = "AI"

# Observability settings
[observability]
enabled = true

# Preview environment (development)
[env.preview]
name = "user-management-worker-preview"
vars = { ENVIRONMENT = "preview", CULINARY_PROFILE_ENABLED = "true", PANTRY_ENABLED = "true", PANTRY_SCAN_ENABLED = "true", RECIPE_NOTES_ENABLED = "true" }

[[env.preview.d1_databases]]
binding = "USER_DB"
database_name = "user-db-preview"
database_id = "863a849b-1dd9-4832-a23b-977ff508713a"

[env.preview.observability]
enabled = true

[env.preview.ai]
binding = "AI"

# Production environment
[env.production]
name = "user-management-worker-production"
vars = { ENVIRONMENT = "production", CULINARY_PROFILE_ENABLED = "true", PANTRY_ENABLED = "true", PANTRY_SCAN_ENABLED = "true", RECIPE_NOTES_ENABLED = "true" }

[[env.production.d1_databases]]
binding = "USER_DB"
database_name = "user-db-production"
database_id = "f8a952a5-acdb-48c7-88e7-57a53402e719"

[env.production.observability]
enabled = true

[env.production.ai]
binding = "AI"

# Staging environment
[env.staging]
name = "user-management-worker-staging"
vars = { ENVIRONMENT = "staging", CULINARY_PROFILE_ENABLED = "true", PANTRY_ENABLED = "true", PANTRY_SCAN_ENABLED = "true", RECIPE_NOTES_ENABLED = "true" }

[[env.staging.d1_databases]]
binding = "USER_DB"
database_name = "user-db-staging"
database_id = "171ffc3f-40bd-4738-b879-4ccd8d79db39"

[env.staging.observability]
enabled = true

[env.staging.ai]
binding = "AI"

# JWT_SECRET must match the auth-worker that issued the token for authenticated
# /me/culinary-profile and /me/pantry-items routes. Secrets are per Worker script,
# so the top-level deployment needs its own copy — it is the script the deployed
# frontend calls (recipe-app/.env.production points at
# user-management-worker.nolanfoster.workers.dev), and it is not covered by any
# --env flag. Without it every authenticated request fails; the routes answer 503
# "Authentication is not configured on this deployment" so it is distinguishable
# from a rejected token.
#   wrangler secret put JWT_SECRET               # top-level deployment (auth-worker production)
#   wrangler secret put JWT_SECRET --env preview
#   wrangler secret put JWT_SECRET --env staging
#   wrangler secret put JWT_SECRET --env production
#
# Set the same secret on each environment before enabling passkey routes:
#   wrangler secret put PASSKEY_SERVICE_TOKEN --env preview
#   wrangler secret put PASSKEY_SERVICE_TOKEN --env staging
#   wrangler secret put PASSKEY_SERVICE_TOKEN --env production
