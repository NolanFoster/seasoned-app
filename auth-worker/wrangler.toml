name = "auth-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV Namespace for OTP/challenge fallback storage. OTP_KV_PREFIX isolates environments.
[[kv_namespaces]]
binding = "OTP_KV"
id = "1fdebf1b59e249a691746f85a9eb5e62"

[[durable_objects.bindings]]
name = "PASSKEY_CHALLENGE_DO"
class_name = "PasskeyChallengeObject"

[[migrations]]
tag = "v1"
new_classes = ["PasskeyChallengeObject"]

[vars]
ENVIRONMENT = "production"
OTP_KV_PREFIX = "production"
FROM_EMAIL = "verify@seasonedapp.com"
USER_MANAGEMENT_WORKER_URL = "https://user-management-worker.nolanfoster.workers.dev"
WEBAUTHN_RP_ID = "seasonedapp.com"
WEBAUTHN_RP_NAME = "Seasoned"
WEBAUTHN_ORIGIN = "https://seasonedapp.com"

[[send_email]]
name = "send_email"

# JWT_SECRET and PASSKEY_SERVICE_TOKEN are secrets, not vars. Configure both
# on auth-worker and user-management-worker for each deployed environment:
#   wrangler secret put JWT_SECRET --env preview
#   wrangler secret put PASSKEY_SERVICE_TOKEN --env preview
#   wrangler secret put JWT_SECRET --env staging
#   wrangler secret put PASSKEY_SERVICE_TOKEN --env staging
#   wrangler secret put JWT_SECRET --env production
#   wrangler secret put PASSKEY_SERVICE_TOKEN --env production
#
# EMAIL_ENCRYPTION_KEY is an auth-worker-only secret: base64 of 32 random bytes
# (openssl rand -base64 32). It encrypts the address on the user row so a
# discoverable passkey, which identifies its owner only by the one-way email
# hash, can still mint a session token. Without it, usernameless sign-in
# answers 503 and the email-first passkey flow continues to work. Rotating it
# strands addresses stored under the old key; each account re-stores its own on
# the next OTP sign-in, so rotate only when that re-prompt is acceptable.
#   wrangler secret put EMAIL_ENCRYPTION_KEY --env preview
#   wrangler secret put EMAIL_ENCRYPTION_KEY --env staging
#   wrangler secret put EMAIL_ENCRYPTION_KEY --env production

[observability]
enabled = true

[env.preview]
name = "auth-worker-preview"
[[env.preview.migrations]]
tag = "v1"
new_classes = ["PasskeyChallengeObject"]


[env.preview.vars]
ENVIRONMENT = "preview"
OTP_KV_PREFIX = "preview"
FROM_EMAIL = "verify@seasonedapp.com"
USER_MANAGEMENT_WORKER_URL = "https://user-management-worker-preview.nolanfoster.workers.dev"
WEBAUTHN_RP_ID = "seasoned-frontend.pages.dev"
WEBAUTHN_RP_NAME = "Seasoned (Preview)"
WEBAUTHN_ORIGIN = "https://seasoned-frontend.pages.dev"

[[env.preview.send_email]]
name = "send_email"

[[env.preview.kv_namespaces]]
binding = "OTP_KV"
id = "1fdebf1b59e249a691746f85a9eb5e62"

[[env.preview.durable_objects.bindings]]
name = "PASSKEY_CHALLENGE_DO"
class_name = "PasskeyChallengeObject"

[env.preview.observability]
enabled = true

[env.production]
name = "auth-worker-production"
routes = [
  { pattern = "auth.seasonedapp.com", custom_domain = true }
]
[[env.production.migrations]]
tag = "v1"
new_classes = ["PasskeyChallengeObject"]


[env.production.vars]
ENVIRONMENT = "production"
OTP_KV_PREFIX = "production"
FROM_EMAIL = "verify@seasonedapp.com"
# Must be the same user-management-worker script the production frontend calls
# (recipe-app/.env.production VITE_USER_MANAGEMENT_URL). User rows are created
# through this URL, while culinary profile and pantry rows are written directly
# by the frontend; both tables carry a FOREIGN KEY to users(user_id), so a split
# across two scripts puts the parent row in a different D1 database than its
# children and every write fails the constraint.
USER_MANAGEMENT_WORKER_URL = "https://user-management-worker.nolanfoster.workers.dev"
WEBAUTHN_RP_ID = "seasonedapp.com"
WEBAUTHN_RP_NAME = "Seasoned"
WEBAUTHN_ORIGIN = "https://seasonedapp.com"

[[env.production.send_email]]
name = "send_email"

[[env.production.kv_namespaces]]
binding = "OTP_KV"
id = "1fdebf1b59e249a691746f85a9eb5e62"

[[env.production.durable_objects.bindings]]
name = "PASSKEY_CHALLENGE_DO"
class_name = "PasskeyChallengeObject"

[env.production.observability]
enabled = true

[env.staging]
name = "auth-worker-staging"
[[env.staging.migrations]]
tag = "v1"
new_classes = ["PasskeyChallengeObject"]


[env.staging.vars]
ENVIRONMENT = "staging"
OTP_KV_PREFIX = "staging"
FROM_EMAIL = "verify@seasonedapp.com"
USER_MANAGEMENT_WORKER_URL = "https://user-management-worker-staging.nolanfoster.workers.dev"
WEBAUTHN_RP_ID = "seasoned-frontend.pages.dev"
WEBAUTHN_RP_NAME = "Seasoned"
WEBAUTHN_ORIGIN = "https://seasoned-frontend.pages.dev"

[[env.staging.send_email]]
name = "send_email"

[[env.staging.kv_namespaces]]
binding = "OTP_KV"
id = "1fdebf1b59e249a691746f85a9eb5e62"

[[env.staging.durable_objects.bindings]]
name = "PASSKEY_CHALLENGE_DO"
class_name = "PasskeyChallengeObject"

[env.staging.observability]
enabled = true
