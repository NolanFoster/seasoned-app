openapi: 3.0.3
info:
  title: Seasoned Kitchen Workflow Agent
  version: 1.0.0
  description: >-
    Flag-gated, checkpointed plan-to-cook workflows. Set KITCHEN_WORKFLOW_V1
    to an enabled value before exposing these routes.
servers:
  - url: https://recipe-generation-worker.nolanfoster.workers.dev
security:
  - accountSubject: []
paths:
  /agent/workflow/start:
    post:
      summary: Start a durable kitchen workflow
      operationId: startKitchenWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRequest'
            example:
              type: week_plan
              goal: Plan three dinners under 40 minutes
              slots: [2026-09-07::dinner, 2026-09-08::dinner, 2026-09-09::dinner]
              usePantry: true
              pantryIngredients:
                - name: carrots
                  quantity: 4
                  unit: piece
      responses:
        '200':
          description: Draft created and paused for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
  /agent/workflow/{workflowId}:
    get:
      summary: Inspect a workflow checkpoint
      operationId: getKitchenWorkflow
      parameters:
        - $ref: '#/components/parameters/workflowId'
      responses:
        '200':
          description: Current workflow state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '404':
          description: Workflow not found or feature disabled
  /agent/workflow/{workflowId}/resume:
    post:
      summary: Resume a workflow at its pending interrupt
      operationId: resumeKitchenWorkflow
      parameters:
        - $ref: '#/components/parameters/workflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeWorkflowRequest'
            examples:
              approve:
                value: { action: approve_plan }
              shoppingComplete:
                value: { action: grocery_done }
              skipPrep:
                value: { action: skip_prep }
              startCooking:
                value: { action: start_cooking }
      responses:
        '200':
          description: Workflow advanced and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '409':
          description: Invalid transition or stale expectedVersion
  /agent/workflow/{workflowId}/cancel:
    post:
      summary: Cancel a workflow
      operationId: cancelKitchenWorkflow
      parameters:
        - $ref: '#/components/parameters/workflowId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 240 }
      responses:
        '200':
          description: Cancelled workflow state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
components:
  securitySchemes:
    accountSubject:
      type: apiKey
      in: header
      name: X-User-Id
      description: Trusted identity header supplied by the authenticated gateway.
  parameters:
    workflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        pattern: '^kwf_[A-Za-z0-9_-]{8,120}$'
  responses:
    FeatureDisabled:
      description: Feature flag is off
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: FEATURE_DISABLED
            error: Kitchen Workflow V1 is not enabled
  schemas:
    StartWorkflowRequest:
      type: object
      properties:
        userId: { type: string, maxLength: 160 }
        type:
          type: string
          enum: [week_plan, dinner_tonight, prep_batch, inspire_to_table]
        goal:
          oneOf:
            - { type: string, maxLength: 500 }
            - { type: object, additionalProperties: true }
        slots:
          type: array
          minItems: 1
          maxItems: 28
          items:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}::(breakfast|lunch|dinner|snack)$'
        culinaryProfile: { type: object, additionalProperties: true }
        overrides: { type: object, additionalProperties: true }
        usePantry: { type: boolean }
        pantryIngredients:
          type: array
          maxItems: 50
          items: { type: object, additionalProperties: true }
      required: [type]
    ResumeWorkflowRequest:
      type: object
      required: [action]
      properties:
        userId: { type: string, maxLength: 160 }
        action:
          type: string
          enum: [approve_plan, edit_plan, retry_plan, grocery_done, prep_done, skip_prep, start_cooking, cancel]
        expectedVersion: { type: integer, minimum: 1 }
        overrides: { type: object, additionalProperties: true }
        reason: { type: string, maxLength: 240 }
    WorkflowResponse:
      type: object
      required: [success, workflowId, status, traceId, workflow]
      properties:
        success: { type: boolean }
        workflowId: { type: string }
        status: { type: string, enum: [running, awaiting_user, failed, completed, cancelled] }
        traceId: { type: string }
        workflow: { type: object, additionalProperties: true }
    Error:
      type: object
      required: [success, code, error]
      properties:
        success: { type: boolean }
        code: { type: string }
        error: { type: string }
