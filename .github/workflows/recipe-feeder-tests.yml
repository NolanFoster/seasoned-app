name: Recipe Feeder Tests and Coverage

on:
  push:
    branches: [ main, staging, develop ]
    paths:
      - 'recipe-feeder/**'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'recipe-feeder/**'

defaults:
  run:
    working-directory: recipe-feeder

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'recipe-feeder/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Run type checking
      run: npm run type-check
    
    - name: Run tests with coverage
      run: npm run test:coverage
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./recipe-feeder/coverage/lcov.info
        flags: recipe-feeder
        name: recipe-feeder-coverage
        fail_ci_if_error: false
    
    # Minimums live in .github/coverage-thresholds.json. This previously compared
    # only line coverage against a hardcoded 80, and silently passed whenever
    # coverage-summary.json was absent — which it always was, because the
    # json-summary reporter was not enabled.
    - name: Check coverage thresholds
      if: always()
      working-directory: .
      run: node scripts/check-coverage.mjs --package recipe-feeder
