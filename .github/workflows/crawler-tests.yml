name: Crawler Tests

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'crawler/**'
      - '.github/workflows/crawler-tests.yml'
      - 'requirements.txt'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'crawler/**'
      - '.github/workflows/crawler-tests.yml'
      - 'requirements.txt'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  test-crawler:
    name: Crawler Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python Dependencies
      working-directory: ./crawler
      run: |
        pip install -r requirements.txt
    
    # NOT part of the Code Coverage gate, deliberately.
    #
    # `test_jsonld_crawler.py` is an integration script that fetches a live
    # third-party recipe site. It measures no in-process coverage, and making it
    # blocking would let an unrelated site outage fail every pull request. It
    # runs here for signal only.
    #
    # To bring the crawler under the gate it needs offline unit tests with
    # recorded fixtures; then add it to .github/coverage-thresholds.json and
    # enforce with `pytest --cov=. --cov-fail-under=<minimum>`.
    # See docs/CODE_COVERAGE.md.
    - name: Run Crawler Tests (non-blocking, hits a live site)
      working-directory: ./crawler
      continue-on-error: true
      run: |
        pip install pytest
        # The previous filter looked for test_crawler.py, which does not exist,
        # so the crawler's tests never actually ran.
        if ls test_*.py >/dev/null 2>&1; then
          python -m pytest test_*.py -v
        else
          echo "No test files found for crawler"
        fi

  lint-crawler:
    name: Crawler Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python Dependencies
      working-directory: ./crawler
      run: |
        pip install -r requirements.txt
        pip install flake8 black
    
    - name: Lint Crawler Code
      working-directory: ./crawler
      run: |
        # Run flake8 for linting
        if command -v flake8 &> /dev/null; then
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Linting completed with warnings"
        else
          echo "Flake8 not available for linting"
        fi
        
        # Run black for code formatting check
        if command -v black &> /dev/null; then
          black --check . || echo "Code formatting check completed with warnings"
        else
          echo "Black not available for code formatting check"
        fi
