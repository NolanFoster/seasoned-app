name: Recipe View Worker Tests

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'recipe-view-worker/**'
      - '.github/workflows/recipe-view-worker-tests.yml'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'recipe-view-worker/**'
      - '.github/workflows/recipe-view-worker-tests.yml'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  test-worker:
    name: Recipe View Worker Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: recipe-view-worker/package-lock.json
    
    - name: Install Worker Dependencies
      working-directory: ./recipe-view-worker
      run: npm ci
    
    - name: Run Worker Tests with Coverage
      working-directory: ./recipe-view-worker
      run: |
        echo "Running tests with coverage..."
        npm run test:coverage
        echo "✅ Tests passed successfully!"
    
    # Minimums live in .github/coverage-thresholds.json and are enforced twice:
    # by vitest during the run above, and by this script against the emitted
    # report. This replaces ~100 lines of hand-rolled lcov arithmetic that ended
    # in "Coverage is below thresholds but not failing the build" — i.e. it
    # measured coverage and then ignored the result.
    - name: Check Coverage Thresholds
      id: coverage-check
      if: always()
      run: node scripts/check-coverage.mjs --package recipe-view-worker

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recipe-view-worker-coverage
        path: recipe-view-worker/coverage/
        retention-days: 30


  lint-worker:
    name: Recipe View Worker Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Lint Worker
      working-directory: ./recipe-view-worker
      run: |
        npm ci
        if npm run | grep -q "lint"; then
          npm run lint || echo "Linting completed with warnings"
        else
          echo "No lint script found"
        fi