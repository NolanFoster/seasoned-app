name: Recipe Embedding Worker Tests

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'recipe-embedding-worker/**'
      - '.github/workflows/recipe-embedding-worker-tests.yml'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'recipe-embedding-worker/**'
      - '.github/workflows/recipe-embedding-worker-tests.yml'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  test-worker:
    name: Recipe Embedding Worker Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: recipe-embedding-worker/package-lock.json
    
    - name: Install Worker Dependencies
      working-directory: ./recipe-embedding-worker
      run: npm ci
    
    - name: Run Worker Tests with Coverage
      working-directory: ./recipe-embedding-worker
      run: |
        echo "Running tests with coverage..."
        npm run test:coverage
        echo "✅ Tests passed successfully!"
    
    # Minimums live in .github/coverage-thresholds.json, enforced by vitest
    # during the run above and re-checked here against the emitted report.
    # This replaces a hand-rolled block that parsed percentages out of
    # console output and compared them to thresholds hardcoded in shell,
    # which drifted from the numbers the test config actually used.
    - name: Check Coverage Thresholds
      id: coverage-check
      if: always()
      run: node scripts/check-coverage.mjs --package recipe-embedding-worker

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        file: ./recipe-embedding-worker/coverage/lcov.info
        flags: recipe-embedding-worker
        name: recipe-embedding-worker-coverage
        fail_ci_if_error: false
