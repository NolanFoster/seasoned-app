name: Auth Worker Tests

on:
  push:
    branches: [ main, staging, develop ]
    paths:
      - 'auth-worker/**'
      - 'shared/**'
      - '.github/workflows/auth-worker-tests.yml'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'auth-worker/**'
      - 'shared/**'
      - '.github/workflows/auth-worker-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: auth-worker/package-lock.json
    
    - name: Install shared dependencies
      run: |
        cd shared
        npm ci
    
    - name: Install dependencies
      run: |
        cd auth-worker
        npm ci
    
    - name: Run linting
      run: |
        cd auth-worker
        npm run lint
    
    - name: Run type checking
      run: |
        cd auth-worker
        npm run type-check
    
    - name: Run tests with coverage
      run: |
        cd auth-worker
        npm run test:coverage
    
    # Minimums live in .github/coverage-thresholds.json, enforced by vitest
    # during the run above and re-checked here against the emitted report.
    # This replaces a hand-rolled block that parsed percentages out of
    # console output and compared them to thresholds hardcoded in shell,
    # which drifted from the numbers the test config actually used.
    - name: Check Coverage Thresholds
      id: coverage-check
      if: always()
      run: node scripts/check-coverage.mjs --package auth-worker
