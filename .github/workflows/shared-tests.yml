name: Shared Components Tests

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'shared/**'
      - '.github/workflows/shared-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'shared/**'
      - '.github/workflows/shared-tests.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  test-shared:
    name: Shared Components Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: shared/package-lock.json
    
    - name: Install Shared Dependencies
      working-directory: ./shared
      run: npm ci
    
    # Non-blocking, and this is a known failure rather than a tolerated one:
    # test-simple.js exercises `compressData(undefined)`, and decompressData
    # then throws "Unexpected end of JSON input" because JSON.stringify(undefined)
    # produces no bytes to parse back. The unhandled rejection kills the script
    # after its own summary reports 10/10 passed.
    #
    # The previous `|| echo` hid this entirely. Fix the round-trip in
    # shared/kv-storage.js, then drop continue-on-error here.
    - name: Run Shared Tests (non-blocking, see known failure above)
      working-directory: ./shared
      continue-on-error: true
      run: npm test

    # The real gate for `shared`: the vitest suite, with minimums from
    # .github/coverage-thresholds.json. A shortfall fails this step rather than
    # being logged and ignored.
    - name: Run Shared Tests with Coverage
      working-directory: ./shared
      run: npm run test:coverage

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: shared-coverage
        path: shared/coverage/
        retention-days: 14
        if-no-files-found: ignore

  lint-shared:
    name: Shared Components Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Lint Shared Components
      working-directory: ./shared
      run: |
        npm ci
        if npm run | grep -q "lint"; then
          npm run lint || echo "Linting completed with warnings"
        else
          echo "No lint script found"
        fi
