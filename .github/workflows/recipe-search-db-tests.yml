name: Recipe Search DB Tests

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'recipe-search-db/**'
      - '.github/workflows/recipe-search-db-tests.yml'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'recipe-search-db/**'
      - '.github/workflows/recipe-search-db-tests.yml'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  test-worker:
    name: Recipe Search DB Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: recipe-search-db/package-lock.json
    
    - name: Install Worker Dependencies
      working-directory: ./recipe-search-db
      run: npm ci
    
    # Non-blocking, and not part of the Code Coverage gate. test-search-db.js
    # sends HTTP requests to a *deployed* worker instead of importing modules,
    # so it measures no in-process coverage and currently reports 13/13 failed
    # ("fetch failed") from CI, where no such deployment is reachable. It also
    # exits 0 regardless of results, so the old `|| echo` was hiding a suite
    # that could not pass in the first place.
    #
    # To make this meaningful it needs unit tests against the query builders
    # with D1 stubbed; then add it to .github/coverage-thresholds.json.
    # See docs/CODE_COVERAGE.md.
    - name: Run Worker Tests (non-blocking, needs a deployed worker)
      working-directory: ./recipe-search-db
      continue-on-error: true
      run: npm test

  lint-worker:
    name: Recipe Search DB Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Lint Worker
      working-directory: ./recipe-search-db
      run: |
        npm ci
        if npm run | grep -q "lint"; then
          npm run lint || echo "Linting completed with warnings"
        else
          echo "No lint script found"
        fi
