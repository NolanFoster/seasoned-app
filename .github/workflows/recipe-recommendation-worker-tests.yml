name: Recipe Recommendation Worker Tests

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'recipe-recommendation-worker/**'
      - '.github/workflows/recipe-recommendation-worker-tests.yml'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'recipe-recommendation-worker/**'
      - '.github/workflows/recipe-recommendation-worker-tests.yml'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  test-worker:
    name: Recipe Recommendation Worker Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: recipe-recommendation-worker/package-lock.json
    
    - name: Install Worker Dependencies
      working-directory: ./recipe-recommendation-worker
      run: npm ci
    
    - name: Run Worker Tests with Coverage
      working-directory: ./recipe-recommendation-worker
      run: |
        echo "Running tests with coverage..."
        npm run coverage
        echo "✅ Tests passed successfully!"
    
    # Minimums live in .github/coverage-thresholds.json, enforced by vitest
    # during the run above and re-checked here against the emitted report.
    # This replaces a hand-rolled block that parsed percentages out of
    # console output and compared them to thresholds hardcoded in shell,
    # which drifted from the numbers the test config actually used.
    - name: Check Coverage Thresholds
      id: coverage-check
      if: always()
      run: node scripts/check-coverage.mjs --package recipe-recommendation-worker

    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: recipe-recommendation-worker-coverage
        path: recipe-recommendation-worker/coverage/
        retention-days: 30

  lint-worker:
    name: Recipe Recommendation Worker Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Lint Worker
      working-directory: ./recipe-recommendation-worker
      run: |
        npm ci
        if npm run | grep -q "lint"; then
          npm run lint || echo "Linting completed with warnings"
        else
          echo "No lint script found"
        fi
